spring:
  application:
    name: congresso-dashboard
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:congresso}
    username: ${DB_USER:congresso}
    password: ${DB_PASSWORD:congresso}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

logging:
  level:
    factorystudios: INFO
